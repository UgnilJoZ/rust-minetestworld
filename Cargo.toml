[package]
name = "minetestworld"
version = "0.6.0"
authors = ["Jan Ole Zabel <jan.zabel@posteo.de>"]
license = "AGPL-3.0"
repository = "https://github.com/UgnilJoZ/rust-minetestworld/"
documentation = "http://docs.rs/minetestworld"
description = "Read and modify Minetest worlds"
edition = "2021"
exclude = ["/TestWorld"]

[dependencies]
thiserror = "2"
sqlx = { version = "0.8", features = ["runtime-tokio"], optional = true }
redis = { version = "0.32", default-features = false, features = [
    "tokio-comp",
], optional = true }
rusty-leveldb = { version = "4.0", optional = true }
url = { version = "2.5", optional = true }
tokio = { version = "1", features = ["io-util", "fs"] }
futures = "0.3"
zstd = "0.13"
log = "0.4"
num-integer = "0.1" # Needed for div_floor until https://github.com/rust-lang/rust/issues/88581 is stabilized

[target.'cfg(not(all(target_endian = "big", target_pointer_width = "32")))'.dependencies]
smartstring = { version = "1", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[features]
default = ["redis", "sqlite", "postgres", "leveldb"]
redis = ["dep:redis", "url"]
sqlite = ["sqlx/sqlite"]
postgres = ["sqlx/postgres", "url"]
leveldb = ["rusty-leveldb"]
tls-native-tls = ["sqlx/tls-native-tls", "redis/tokio-native-tls-comp"]
tls-rustls = ["sqlx/tls-rustls", "redis/tokio-rustls-comp"]
